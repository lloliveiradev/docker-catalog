# Jaeger v1 components pinned to 1.53. Newer images dropped the standalone agent/collector flags.
name: jaeger-cassandra

services:
  cassandra:
    image: cassandra:4.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  cassandra-schema:
    image: jaegertracing/jaeger-cassandra-schema:1.53
    depends_on:
      cassandra:
        condition: service_healthy
    restart: "no"

  jaeger-collector:
    image: jaegertracing/jaeger-collector:1.53
    restart: on-failure
    command:
      - "--cassandra.keyspace=jaeger_v1_dc1"
      - "--cassandra.servers=cassandra"
      - "--collector.zipkin.host-port=:9411"
      - "--sampling.initial-sampling-probability=.5"
    environment:
      SAMPLING_CONFIG_TYPE: adaptive
    ports:
      - "14269:14269"
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    depends_on:
      cassandra-schema:
        condition: service_completed_successfully

  jaeger-query:
    image: jaegertracing/jaeger-query:1.53
    restart: on-failure
    command: ["--cassandra.keyspace=jaeger_v1_dc1", "--cassandra.servers=cassandra"]
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "16687:16687"
    depends_on:
      cassandra-schema:
        condition: service_completed_successfully

  jaeger-agent:
    image: jaegertracing/jaeger-agent:1.53
    restart: on-failure
    command: ["--reporter.grpc.host-port=jaeger-collector:14250"]
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
    depends_on:
      - jaeger-collector

  hotrod:
    image: jaegertracing/example-hotrod:1.53
    command: ["-m", "prometheus", "all"]
    environment:
      JAEGER_AGENT_HOST: jaeger-agent
      JAEGER_AGENT_PORT: 6831
      JAEGER_SAMPLER_TYPE: remote
      JAEGER_SAMPLING_ENDPOINT: http://jaeger-agent:5778/sampling
    ports:
      - "${HOTROD_PORT:-8080}:8080"
      - "8083:8083"
    depends_on:
      - jaeger-agent
