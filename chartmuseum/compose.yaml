name: chartmuseum

services:
  chartmuseum:
    image: chartmuseum/chartmuseum:v0.16.2
    restart: unless-stopped
    environment:
      PORT: 8080
      DEBUG: "false"
      STORAGE: local
      STORAGE_LOCAL_ROOTDIR: /charts
      ALLOW_OVERWRITE: "true"
    ports:
      - "${CHARTMUSEUM_PORT:-8080}:8080"
    volumes:
      - chartmuseum-data:/charts

volumes:
  chartmuseum-data:
